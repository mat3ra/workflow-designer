name: Continuous Testing and Automated NPM Publication

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mat3ra/actions
          token: "${{ secrets.BOT_GITHUB_TOKEN }}"
          path: actions
      - name: Validate JS package
        uses: ./actions/js/validate
        with:
          node-version: 24.x
          use-legacy-peer-deps: true
      - name: Run JS tests
        uses: ./actions/js/test
        with:
          node-version: 24.x

  publish:
    needs: run-tests
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mat3ra/actions
          token: "${{ secrets.BOT_GITHUB_TOKEN }}"
          path: actions
      - name: Publish the application package
        uses: ./actions/js/publish
        with:
          node-version: 24.x
          npm-token: ${{ secrets.NPM_TOKEN }}
          github-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          verify-tests: false

  deploy-bundle:
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Build
        shell: bash -l {0}
        run: |
          npm install --legacy-peer-deps && npm run build:standalone

      - name: Deploy Build
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
